  <linearGradient id="waveMid" x1="0" y1="0" x2="1" y2=".25">
    <stop offset="0" stop-color="#159ce4"/>
    <stop offset=".55" stop-color="#16c2e5"/>
    <stop offset="1" stop-color="#62e0ee"/>
  </linearGradient>
  <linearGradient id="waveDeep" x1="0" y1="0" x2="1" y2=".2">
    <stop offset="0" stop-color="#075da8"/>
    <stop offset="1" stop-color="#06417e"/>
